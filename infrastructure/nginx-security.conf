# ═══════════════════════════════════════════════════════════════
# TATVIYA — NGINX SECURITY & RATE LIMITING CONFIGURATION
# Compliant with Mozilla Observatory, SecurityHeaders.com, and SSL Labs (A+)
# Enforces IP Rate Limiting: 100 requests per 1 hour (3600 seconds)
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# 1. RATE LIMITING ZONES (Define inside 'http' block)
# ─────────────────────────────────────────────────────────────

# Limit site access to 100 requests per hour per IP address (100r/h)
# $binary_remote_addr stores IPv4 in 4 bytes, IPv6 in 16 bytes (~160,000 IPs in 10MB)
limit_req_zone $binary_remote_addr zone=tatviya_site_ratelimit:10m rate=100r/h;

# Strict rate limit for contact form submissions (5 requests per hour per IP)
limit_req_zone $binary_remote_addr zone=tatviya_contact_ratelimit:10m rate=5r/h;

# Return HTTP 429 Too Many Requests instead of default 503 Service Unavailable
limit_req_status 429;
limit_req_log_level warn;

# ─────────────────────────────────────────────────────────────
# 2. SERVER BLOCK INTEGRATION
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tatviya.com www.tatviya.com;

    root /var/www/tatviya;
    index index.html;

    # SSL Certificates (managed via Let's Encrypt / Certbot or AWS ACM)
    # ssl_certificate /etc/letsencrypt/live/tatviya.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tatviya.com/privkey.pem;

    # ─────────────────────────────────────────────────────────
    # A. HARDENED SECURITY HEADERS
    # ─────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://formsubmit.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;" always;

    # ─────────────────────────────────────────────────────────
    # B. SITE-WIDE IP RATE LIMITING (100 requests per 1 hour)
    # ─────────────────────────────────────────────────────────
    # Burst allows reasonable navigation bursts (up to 20 assets without queuing)
    # nodelay ensures valid traffic is served instantly without artificial delay
    limit_req zone=tatviya_site_ratelimit burst=20 nodelay;

    # Custom 429 Rate Limit Handler
    error_page 429 /429.html;
    location = /429.html {
        internal;
        add_header Retry-After 3600 always;
        add_header X-RateLimit-Limit 100 always;
        add_header X-RateLimit-Remaining 0 always;
        add_header X-RateLimit-Reset 3600 always;
    }

    # ─────────────────────────────────────────────────────────
    # C. CONTACT API RATE LIMITING (5 submissions per hour)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=tatviya_contact_ratelimit burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
    }

    # Clean URL handling for HTML pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 Handler
    error_page 404 /index.html;

    # Static Assets Caching
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2|woff|ttf|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
